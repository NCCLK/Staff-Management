<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCC Staff Management Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d9dfe7;--a:#1b998b;--b:#f2a33a;--c:#e4572e;--d:#3d5a99;--e:#8e6bbf;--ok:#1b998b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--panel:#18223a;--ink:#e8edf6;--mute:#93a1ba;--line:#2a3654;--d:#7ea0e6;--e:#b496e6}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.kv{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 22px;background:#14213d;color:#fff}
.top h1{font-size:22px;font-weight:700;color:#fff}.top small{color:#cfd8ea}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--a)}.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.top .btn{background:#ffffff1f;color:#fff;border:1px solid #ffffff88}.top .btn:hover{background:#ffffff38}
.shell{display:grid;grid-template-columns:250px 1fr;gap:18px;padding:18px 22px;max-width:1500px;margin:auto}
aside{position:sticky;top:12px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
aside label{display:grid;gap:4px;font-weight:600;font-size:13px;color:var(--mute)}
select,input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
nav button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
nav button[aria-selected=true]{background:#1b998b;color:#fff;border-color:#1b998b}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:10px;padding:10px 14px}
.kpi:nth-child(2n){border-left-color:var(--b)}.kpi:nth-child(3n){border-left-color:var(--d)}
.kpi span{font-size:12.5px;color:var(--mute)}.kv{font-size:26px;font-weight:700;line-height:1.2}.kpi small{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;grid-column:span 6;min-width:0}
.card.w{grid-column:span 12}.card.t{grid-column:span 4}
.card h3{font-size:16px;margin-bottom:2px}.card p.s{margin:0 0 8px;color:var(--mute);font-size:13px}
.cv{position:relative;height:260px}
ul.ins{margin:0;padding-left:18px}ul.ins li{margin:5px 0}
.tw{overflow:auto;max-height:480px}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;color:var(--mute)}tbody tr:hover{background:var(--bg)}
td.n,th.n{text-align:right}.pill{padding:1px 8px;border-radius:99px;font-size:12px;color:#fff}
.hm td{text-align:center;min-width:54px;font-size:11px;color:#fff;border:2px solid var(--panel)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--a)}.empty{padding:30px;text-align:center;color:var(--mute)}.warn{background:#f2a33a22;border:1px solid var(--b);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13.5px}
.pane{display:none}.pane.on{display:block}
@media(max-width:900px){.shell{grid-template-columns:1fr;padding:12px}aside{position:static}.card,.card.t{grid-column:span 12}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div><h1>NCC Staff Management</h1><small id="status">Loading from Google Sheets…</small></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="refresh">Refresh data</button>
    <label class="btn" style="margin:0">Load Excel file<input type="file" id="file" accept=".xlsx,.xls" hidden></label>
  </div>
</header>
<div class="shell">
<aside aria-label="Filters">
  <h2 style="font-size:17px">Filters</h2>
  <label>From month<select id="fFrom"></select></label>
  <label>To month<select id="fTo"></select></label>
  <label>Role<select id="fRole"></select></label>
  <label>Staff code<select id="fPid"></select></label>
  <label>Performance stage<select id="fStage"></select></label>
  <label>Work location<select id="fLoc"></select></label>
  <label>Shift start<input type="time" id="fS0" value="08:30"></label><label>Shift end<input type="time" id="fS1" value="17:30"></label>
  <button class="btn" id="reset">Reset filters</button>
  <div class="chips" id="active"></div>
</aside>
<main>
  <nav role="tablist" id="tabs"></nav>
  <div id="warn"></div>
  <section class="pane" id="p-overview"></section>
  <section class="pane" id="p-pay"></section>
  <section class="pane" id="p-att"></section>
  <section class="pane" id="p-pen"></section>
  <section class="pane" id="p-fb"></section>
  <section class="pane" id="p-staff"></section>
  <section class="pane" id="p-profile"></section>
</main>
</div>
<script>
/* ===== CONFIG ===== */
const SHEET_ID='1y2MESil6rY2hQ8kt60Bjroezw3GrmSEkyKc4nOZivjQ';
const TABS={pay:'Payment Summery',att:'Attendance & Leave',pen:'Penalty Points',fb:'Feedback & Evaluation',road:'Roadmap'};
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const STAGE_COL={ACHIEVING:'#1b998b',STABLE:'#3d5a99',DEPENDING:'#f2a33a',FAIL:'#e4572e'};
const LADDER=['TR','BA','BE','SC','SM','BM'];
const $=id=>document.getElementById(id);
let D={pay:[],att:[],pen:[],fb:[],road:[],codes:[]},F={},charts={},tab='overview',sortKey='earn',sortDir=-1,q='';
const fmt=v=>Math.round(v).toLocaleString('en-US'),pct=v=>(v*100).toFixed(0)+'%',r1=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100;
const sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const hm=m=>Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'m';

/* ===== PARSING ===== */
function csv(t){const rows=[];let r=[],c='',i=0,qt=false;for(;i<t.length;i++){const ch=t[i];
 if(qt){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else qt=false}else c+=ch}
 else if(ch=='"')qt=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
const num=v=>{if(v==null||v==='')return 0;const x=parseFloat(String(v).replace(/[,%\sRs₨]/g,''));return isNaN(x)?0:x};
const kpiV=v=>{const x=num(v);return String(v).includes('%')||x>1.5?x/100:x};
function pdate(s){s=String(s||'').trim();if(!s)return null;let m;
 if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return new Date(+m[1],m[2]-1,+m[3]);
 if(m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/)){let a=+m[1],b=+m[2];return a>12?new Date(+m[3],b-1,a):new Date(+m[3],a-1,b)}
 const d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pmin(s){const m=String(s||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i);if(!m)return null;let h=+m[1];if(m[3]){h%=12;if(/pm/i.test(m[3]))h+=12}return h*60+ +m[2]}
const mIdx=s=>{const m=String(s||'').trim().match(/^([A-Za-z]{3})[a-z]*[-\s'](\d{2,4})$/);if(!m)return null;const k=MON.indexOf(m[1].toLowerCase());if(k<0)return null;let y=+m[2];if(y<100)y+=2000;return y*12+k};
const mLabel=i=>MON[i%12][0].toUpperCase()+MON[i%12].slice(1)+' '+String(Math.floor(i/12)).slice(2);
function psec(s){const m=String(s||'').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);if(!m)return null;let h=+m[1];if(m[4]){h%=12;if(/pm/i.test(m[4]))h+=12}return h*3600+ +m[2]*60+(+m[3]||0)}
const dIdx=d=>d.getFullYear()*12+d.getMonth();
const hdr=(rows,key)=>{const i=rows.findIndex(r=>String(r[0]).trim().toUpperCase()==key);return i<0?0:i+1};

function normalize(raw){
 // Payroll: keyed by PID (col E). Names are NOT required, many rows have none.
 const pay=[];raw.pay.slice(hdr(raw.pay,'MONTH')).forEach(r=>{const mi=mIdx(r[1]),pid=(r[4]||'').trim().toUpperCase();if(mi==null||!pid)return;
  const o={mi,pid,role:(r[5]||'').trim(),nopay:num(r[6]),asmt:num(r[7]),review:num(r[8]),kpi:kpiV(r[10]),salary:num(r[13]),mpl:num(r[14])+num(r[15])+num(r[16]),mpw:num(r[17])+num(r[18])+num(r[19]),pp:num(r[26]),tp:num(r[27]),com:num(r[29]),inc:num(r[30]),bon:num(r[31]),earn:num(r[32]),stage:(r[39]||'').trim().toUpperCase()};
  if(o.earn>0||o.tp>0||o.salary>0)pay.push(o)});
 // Attendance: PID is column B
 const att=[];let bad=0;raw.att.slice(hdr(raw.att,'TIMESTAMP')).forEach(r=>{const st=(r[2]||'').trim(),pid=(r[1]||'').trim().toUpperCase();if(!pid||!st)return;
  const d=pdate(st=='Work'?r[3]:st=='Short Leave'?r[8]:r[12]);if(!d)return;if(d.getFullYear()<2025||d>new Date(Date.now()+864e5*3)){bad++;return}
  att.push({pid,st,d,mi:dIdx(d),act:(r[4]||'').trim(),t:pmin(r[5]),ts:psec(r[0]),loc:(r[6]||'').trim(),type:(r[11]||'').trim(),dur:(r[16]||'').trim(),ms:(r[17]||'').trim().toUpperCase(),s1:pmin(r[9]),s2:pmin(r[10])})});
 const pen=[];raw.pen.slice(hdr(raw.pen,'TIMESTAMP')).forEach(r=>{const d=pdate(r[3])||pdate(r[0]);if(!d||!r[2])return;
  pen.push({d,mi:dIdx(d),pid:r[2].trim().toUpperCase().replace(/^BC/,''),cat:(r[4]||'').trim(),rule:(r[5]||'').trim(),pp:num(r[7])||1,st:(r[8]||'').trim().toUpperCase(),act:(r[11]||'').trim().toUpperCase()||'NO ACTION'})});
 const fb=[];raw.fb.slice(hdr(raw.fb,'TIMESTAMP')).forEach(r=>{const d=pdate(r[0]);const sc=r.slice(3,13).map(num);if(!d||!r[2]||!sc.some(x=>x))return;
  const m=r[2].match(/^BC([A-Za-z]+)\s*-/);fb.push({d,mi:dIdx(d),pid:m?m[1].toUpperCase():null,label:m?m[1].toUpperCase():r[2].replace(/^Prospect\s*-\s*/i,'').trim().slice(0,3).toUpperCase()+' (prospect)',role:(r[1]||'').trim(),sc,avg:avg(sc.filter(x=>x))})});
 const road=(raw.road||[]).slice(hdr(raw.road||[],'CODE')).filter(r=>LADDER.includes((r[0]||'').trim())).map(r=>({code:r[0].trim(),title:r[1],tp:num(r[6]),ptp:num(r[7]),asmt:num(r[8]),review:num(r[9]),exp:num(r[3])}));
 const codes=[...new Set([...att.map(x=>x.pid),...pay.map(x=>x.pid),...pen.map(x=>x.pid),...fb.map(x=>x.pid).filter(Boolean)])].sort();
 return{pay,att,pen,fb,road,codes,bad,qs:(raw.fb[0]||[]).slice(3,13).map(s=>s.replace(/^\d+\.\s*/,'').trim())}}

/* ===== LOADING ===== */
async function fetchTab(n){const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(n)}`;
 const r=await fetch(u);if(!r.ok)throw new Error(n+': HTTP '+r.status);return csv(await r.text())}
async function load(){$('status').textContent='Loading from Google Sheets…';
 try{const ks=Object.keys(TABS),res=await Promise.all(ks.map(k=>fetchTab(TABS[k]).catch(e=>{if(k=='road')return[];throw e})));const raw={};ks.forEach((k,i)=>raw[k]=res[i]);
  init(normalize(raw),'Live from Google Sheets')}
 catch(e){$('status').textContent='Could not reach Google Sheets';
  $('warn').innerHTML='<div class="warn"><b>Live data unavailable.</b> Share the sheet as “Anyone with the link – Viewer”, then press Refresh data. You can also load the downloaded Excel file with the button at top right. ('+e.message+')</div>'}}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const raw={};
 for(const k in TABS){const ws=wb.Sheets[TABS[k]];raw[k]=ws?XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd hh:mm',defval:''}):[]}
 init(normalize(raw),'Loaded from file '+f.name)};
$('refresh').onclick=load;

/* ===== FILTERS ===== */
function init(d,src){D=d;D.months=[...new Set([...d.pay.map(x=>x.mi),...d.att.map(x=>x.mi)])].sort((a,b)=>a-b);
 const opt=(el,items,all)=>{el.innerHTML=(all?`<option value="">${all}</option>`:'')+items.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')};
 const ml=D.months.map(m=>[m,mLabel(m)]);opt($('fFrom'),ml);opt($('fTo'),ml);
 opt($('fRole'),[...new Set(d.pay.map(x=>x.role))].filter(Boolean).sort().map(x=>[x,x]),'All roles');
 opt($('fPid'),d.codes.map(c=>[c,c]),'All staff ('+d.codes.length+')');
 opt($('fStage'),Object.keys(STAGE_COL).map(x=>[x,x[0]+x.slice(1).toLowerCase()]),'All stages');
 opt($('fLoc'),[...new Set(d.att.map(x=>x.loc))].filter(Boolean).sort().map(x=>[x,x]),'All locations');
 resetF();$('status').textContent=src+' · '+new Date().toLocaleTimeString()+' · '+d.codes.length+' staff codes ('+d.codes.join(', ')+')';
 $('warn').innerHTML=d.bad?`<div class="warn">${d.bad} attendance record(s) had an impossible date (e.g. year before 2025) and were ignored. Please correct them in the sheet.</div>`:'';render()}
function resetF(){const m=D.months;$('fFrom').value=m[Math.max(0,m.length-6)];$('fTo').value=m[m.length-1];['fRole','fPid','fStage','fLoc'].forEach(i=>$(i).value='');$('fS0').value='08:30';$('fS1').value='17:30';readF()}
function readF(){F={from:+$('fFrom').value,to:+$('fTo').value,role:$('fRole').value,pid:$('fPid').value,stage:$('fStage').value,loc:$('fLoc').value,s0:pmin($('fS0').value)??510,s1:pmin($('fS1').value)??1050};if(F.from>F.to)[F.from,F.to]=[F.to,F.from]}
['fFrom','fTo','fRole','fPid','fStage','fLoc','fS0','fS1'].forEach(i=>$(i).addEventListener('change',()=>{readF();render()}));
$('reset').onclick=()=>{resetF();render()};

function view(){const inR=m=>m>=F.from&&m<=F.to;
 const roleOf={};[...D.pay].sort((a,b)=>a.mi-b.mi).forEach(x=>roleOf[x.pid]=x.role);D.roleOf=roleOf;
 const ids=new Set(D.codes.filter(p=>(!F.pid||p==F.pid)&&(!F.role||roleOf[p]==F.role)&&(!F.stage||D.pay.some(x=>x.pid==p&&inR(x.mi)&&x.stage==F.stage))));
 const pay=D.pay.filter(x=>inR(x.mi)&&ids.has(x.pid)&&(!F.stage||x.stage==F.stage));
 const narrowed=F.role||F.pid||F.stage;
 return{pay,ids,
  att:D.att.filter(x=>inR(x.mi)&&ids.has(x.pid)&&(!F.loc||x.st!='Work'||x.loc===F.loc)),
  pen:D.pen.filter(x=>inR(x.mi)&&ids.has(x.pid)),
  fb:D.fb.filter(x=>inR(x.mi)&&(x.pid?ids.has(x.pid):!narrowed))}}

/* ===== HELPERS ===== */
function chart(id,type,data,opts={}){if(charts[id])charts[id].destroy();const el=$(id);if(!el)return;const ink=css('--mute'),line=css('--line');
 charts[id]=new Chart(el,{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:ink,boxWidth:12}}},
 scales:['doughnut','pie','radar'].includes(type)?{}:{x:{ticks:{color:ink},grid:{display:false}},y:{ticks:{color:ink},grid:{color:line}}}},opts)})}
const PAL=()=>[css('--a'),css('--b'),css('--d'),css('--c'),css('--e'),'#6c8e3e','#c75c9a','#4aa3c7','#8c7a5b','#999'];
const card=(t,s,id,cls='')=>`<div class="card ${cls}"><h3>${t}</h3><p class="s">${s}</p><div class="cv"><canvas id="${id}"></canvas></div></div>`;
const kpi=(l,v,s='')=>`<div class="kpi"><span>${l}</span><div class="kv">${v}</div><small>${s}</small></div>`;
const empty=m=>`<div class="card w"><div class="empty">${m||'No data for the selected filters. Try widening the month range or resetting filters.'}</div></div>`;
function table(cols,rows,id){return `<div class="tw"><table id="${id}"><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}" data-k="${c.k}">${c.l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-pid="${r.pid||''}">${cols.map(c=>`<td class="${c.n?'n':''}">${c.f?c.f(r[c.k],r):r[c.k]??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const stagePill=s=>s?`<span class="pill" style="background:${STAGE_COL[s]||'#888'}">${s.toLowerCase()}</span>`:'';
const by=(a,f)=>{const m={};a.forEach(x=>(m[f(x)]??=[]).push(x));return m};
const sortBy=(a,k)=>a.sort((x,y)=>typeof x[k]=='string'?sortDir*x[k].localeCompare(y[k]):sortDir*((x[k]||0)-(y[k]||0)));
const fbs=v=>v?v.toFixed(2)+' / 5':'–';
const Z=()=>({days:0,fin:0,l10:0,l30:0,lm:0,e10:0,e30:0,em:0,upd:0,hrs:0,hd:0,home:0,off:0,wk:0,sat:0,sun:0,cas:0,med:0,np:0,shortH:0,short:0});

/* Attendance rules copied from Dashboard-0: shift 08:30-17:30, late/early buckets of 10 and 30 minutes,
   work rows exclude CANCELLED, leave rows exclude REJECTED and CANCELLED, 'not updated promptly' = log time more than 10 min after the work time (or before it). */
function attStats(att){const per={},g=p=>per[p]??=Z(),sd=new Set(),sf=new Set(),smin={},fmax={};
 att.filter(x=>x.st=='Work'&&x.ms!='CANCELLED').forEach(x=>{const o=g(x.pid),k=x.pid+'|'+(+x.d);
  if(x.act=='Start'){if(x.t!=null)smin[k]=Math.min(smin[k]??1e4,x.t);if(!sd.has(k)){sd.add(k);o.days++;if(/home/i.test(x.loc))o.home++}const m=x.t-F.s0;if(m>0)m<=10?o.l10++:m<=30?o.l30++:o.lm++}
  if(x.act=='Finish'){if(x.t!=null)fmax[k]=Math.max(fmax[k]??-1,x.t);if(!sf.has(k)){sf.add(k);o.fin++}const m=F.s1-x.t;if(m>0)m<=10?o.e10++:m<=30?o.e30++:o.em++}
  if(x.ts!=null&&x.t!=null&&(x.act=='Start'||x.act=='Finish')&&(x.ts>x.t*60+600||x.ts<x.t*60))o.upd++});
 Object.keys(smin).forEach(k=>{const d=fmax[k]-smin[k];if(fmax[k]!=null&&d>0&&d<=960){const o=g(k.split('|')[0]);o.hrs+=d;o.hd++}});
 att.filter(x=>x.st=='Day Off & Leave'&&x.ms!='CANCELLED'&&x.ms!='REJECTED').forEach(x=>{const o=g(x.pid),n=/half/i.test(x.dur)?.5:/full/i.test(x.dur)?1:0,t=x.type.toLowerCase();
  if(t=='day off'){o.off+=n;const w=x.d.getDay();w==6?o.sat+=n:w==0?o.sun+=n:o.wk+=n}else if(t.startsWith('casual'))o.cas+=n;else if(t.startsWith('medical'))o.med+=n;else if(t.startsWith('no pay'))o.np+=n});
 att.filter(x=>x.st=='Short Leave').forEach(x=>{const o=g(x.pid);o.short++;if(x.s2>x.s1)o.shortH+=(x.s2-x.s1)/60});
 return per}

 $('stw').innerHTML=table([{k:'pid',l:'Code'},{k:'role',l:'Role'},{k:'stage',l:'Stage',f:stagePill},{k:'kpi',l:'KPI',n:1,f:pct},{k:'tp',l:'TP',n:1,f:fmt},{k:'earn',l:'Earnings',n:1,f:fmt},{k:'days',l:'Work days',n:1},{k:'late',l:'Late %',n:1,f:pct},{k:'upd',l:'Not updated',n:1},{k:'avgh',l:'Avg h/day',n:1,f:v=>v?hm(v):'–'},{k:'leave',l:'Leave days',n:1},{k:'pen',l:'Penalties',n:1},{k:'fb',l:'Feedback',n:1,f:v=>v?v.toFixed(2):'–'},{k:'risk',l:'Risk',n:1,f:v=>`<span class="pill" style="background:${v>=3?'#e4572e':v>=1?'#f2a33a':'#1b998b'}">${v>=3?'High':v>=1?'Watch':'OK'}</span>`}],f,'tb3');bindTable(rows,true)}

function rProfile(V){const p=F.pid;if(!p){$('p-profile').innerHTML=`<div class="card w"><div class="empty">Pick a staff code in <b>Staff member</b> on the left, or click any code in a table, to see that person’s full profile.</div></div>`;return}
 const all=D.pay.filter(x=>x.pid==p).sort((a,b)=>a.mi-b.mi),P=V.pay.slice().sort((a,b)=>a.mi-b.mi),a=attStats(V.att)[p]||Z(),last=P[P.length-1]||all[all.length-1],role=(D.roleOf[p]||'').split('-').pop(),k=LADDER.indexOf(role),nx=D.road.find(r=>r.code==LADDER[k+1]),cu=D.road.find(r=>r.code==role);
 const bar=(l,v,t)=>t?`<div>${l}: <b>${r2(v)}</b> of ${r2(t)} needed</div><div class="bar"><i style="width:${Math.min(100,v/t*100)}%"></i></div>`:'';
 const avgTp=avg(P.map(x=>x.tp)),rv=avg(P.filter(x=>x.review).map(x=>x.review)),pen=V.pen.filter(x=>x.pid==p),fbp=V.fb.filter(x=>x.pid==p);
 $('p-profile').innerHTML=`<div class="kpis">${kpi('Staff code',p,D.roleOf[p]||'no payroll role')}${kpi('Latest stage',last?last.stage||'–':'–',last?mLabel(last.mi):'')}${kpi('Service (payroll months)',all.length)}${kpi('Total TP',fmt(sum(P.map(x=>x.tp))),'avg '+fmt(avgTp)+' / month')}${kpi('Avg KPI',pct(avg(P.map(x=>x.kpi))))}${kpi('Avg review',r2(rv)||'–','assessment '+(r2(avg(P.filter(x=>x.asmt).map(x=>x.asmt)))||'–'))}${kpi('Earnings',fmt(sum(P.map(x=>x.earn))))}</div>
 <div class="grid"><div class="card"><h3>Next level${nx?': '+nx.title:''}</h3><p class="s">Compared with the Roadmap sheet requirements${cu?' (current role '+cu.title+')':''}</p>${nx?bar('Average TP per month',avgTp,nx.tp)+bar('Average review',rv,nx.review)+bar('Service months',all.length,nx.exp):'<div class="empty">No higher level on the roadmap, or the role is not set.</div>'}</div>
 <div class="card"><h3>Attendance and leave</h3><p class="s">Selected months, same rules as Dashboard-0</p><table><tbody>${[['Work days (start / finish)',a.days+' / '+a.fin],['Start late ≤10 / ≤30 / >30 min',a.l10+' / '+a.l30+' / '+a.lm],['Finish early ≤10 / ≤30 / >30 min',a.e10+' / '+a.e30+' / '+a.em],['Not updated promptly',a.upd],['Total recorded hours',hm(a.hrs)],['Day-offs (weekday / Sat / Sun)',a.wk+' / '+a.sat+' / '+a.sun],['Short leave hours',r1(a.shortH)],['Casual / medical / no-pay leave',a.cas+' / '+a.med+' / '+a.np],['Penalty records / points',pen.length+' / '+sum(pen.map(x=>x.pp))],['Feedback',fbp.length?fbs(avg(fbp.map(x=>x.avg)))+' ('+fbp.length+')':'–']].map(r=>`<tr><td>${r[0]}</td><td class="n"><b>${r[1]}</b></td></tr>`).join('')}</tbody></table></div>
 ${card('Monthly TP and KPI','','r1')}${card('Monthly earnings','','r2')}
 <div class="card w"><h3>Stage by month</h3><p class="s"></p><div class="chips">${all.map(x=>`<span class="pill" style="background:${STAGE_COL[x.stage]||'#888'}">${mLabel(x.mi)} · ${(x.stage||'–').toLowerCase()}</span>`).join('')||'No payroll rows'}</div></div></div>`;
 const pal=PAL();if(P.length){chart('r1','bar',{labels:P.map(x=>mLabel(x.mi)),datasets:[{type:'line',label:'KPI %',yAxisID:'y1',data:P.map(x=>x.kpi*100),borderColor:pal[1],backgroundColor:pal[1],tension:.3},{label:'TP',data:P.map(x=>x.tp),backgroundColor:pal[0]}]},{scales:{x:{ticks:{color:css('--mute')}},y:{ticks:{color:css('--mute')},grid:{color:css('--line')}},y1:{position:'right',min:0,max:100,grid:{display:false},ticks:{color:css('--mute')}}}});
 chart('r2','bar',{labels:P.map(x=>mLabel(x.mi)),datasets:[['Salary','salary',0],['Commission','com',1],['Incentive','inc',2],['Bonus','bon',4]].map(([l,kk,c])=>({label:l,data:P.map(x=>x[kk]),backgroundColor:pal[c]}))},{scales:{x:{stacked:true,ticks:{color:css('--mute')}},y:{stacked:true,ticks:{color:css('--mute')},grid:{color:css('--line')}}}})}}

function bindTable(rows,st){const t=document.querySelector('.pane.on table:not(.hm)');if(!t)return;
 t.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;sortDir=sortKey==k?-sortDir:-1;sortKey=k;if(st)stTable(rows);else render()});
 t.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{if(tr.dataset.pid){$('fPid').value=tr.dataset.pid;readF();tab='profile';render()}})}
load();
</script>
